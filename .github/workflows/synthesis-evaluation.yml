name: Compare synthesis drafting
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/evaluate_synthesis.py'
      - 'tests/test_synthesis_evaluation.py'
      - '.github/workflows/synthesis-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthesis-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Validate the non-publishing evaluator
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Install the same inference version observed in production
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            'llama-cpp-python==0.3.36' 'pypdf>=6.0,<7.0'
      - name: Download the existing open model without hosted inference
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 420 \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf' \
            --output /tmp/attention-model.gguf
          test "$(stat -c '%s' /tmp/attention-model.gguf)" -gt 900000000
          sha256sum /tmp/attention-model.gguf
      - name: Compare fixed-source first chunks without publishing readings
        env:
          LOCAL_READING_MODEL: /tmp/attention-model.gguf
        run: |
          python scripts/evaluate_synthesis.py \
            --report /tmp/synthesis-evaluation.json --time-budget-seconds 720
          if ! git diff --quiet -- data/library.json; then
            echo '::error::The diagnostic changed library data; content is suppressed.'
            exit 1
          fi
      - name: Record safe diagnostic results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('/tmp/synthesis-evaluation.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('# First-chunk synthesis comparison\n\n')
              out.write('Diagnostic only. No readings published, no full-document synthesis claim, and no independent editorial review.\n\n')
              if report.exists():
                  out.write('```json\n' + report.read_text(encoding='utf-8') + '\n```\n')
              else:
                  out.write('No completed diagnostic report is available; inspect the failed or timed-out step.\n')
          PY
