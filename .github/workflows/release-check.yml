name: Verify Monday newsletter release
on:
  schedule:
    - cron: '45 8,10 * * 1'
      timezone: America/New_York
    - cron: '30 11 * * 1'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - 'scripts/check_release_deadline.py'
      - 'tests/test_release_deadline.py'
      - '.github/workflows/release-check.yml'
  pull_request:
    paths:
      - 'scripts/check_release_deadline.py'
      - 'tests/test_release_deadline.py'
      - '.github/workflows/release-check.yml'
  workflow_dispatch:
permissions:
  contents: read
# Release checks must never queue behind acquisition or model inference.
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check release-deadline behavior offline
        run: python -m unittest discover -s tests -p 'test_release_deadline.py' -v
  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify live synthesis and recover a confirmed stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_deadline.py --recover
