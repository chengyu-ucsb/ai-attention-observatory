name: Verify full-document reading
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/full_document_access.py'
      - 'scripts/comprehensive_readings.py'
      - 'scripts/article_access_trials.py'
      - 'tests/test_complete_source_reading.py'
      - '.github/workflows/complete-source-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/full_document_access.py'
      - 'scripts/comprehensive_readings.py'
      - 'scripts/article_access_trials.py'
      - 'tests/test_complete_source_reading.py'
      - '.github/workflows/complete-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-document-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install PDF text reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=6.0,<7.0'
      - name: Run complete offline suite and browser checks
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node tests/validate_article_ui.cjs
          node tests/validate_weekly_issue.cjs
      # Historical live probes are opt-in diagnostics, not offline CI checks.
      - name: Test real access routes without retaining article text
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/article_access_trials.py
      - name: Record diagnostics in the cloud run summary
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('data/fulltext-access-tests.json')
          if p.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
                  out.write('# Access tests\n\nRetrieval outcomes, not a guarantee of article access or summary accuracy. No source text saved.\n\n```json\n'+p.read_text()+'\n```\n')
          PY
      - name: Save verified diagnostics on main only
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fulltext-access-tests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record tested article access routes and coverage'
            git pull --rebase origin main
            git push
          fi
