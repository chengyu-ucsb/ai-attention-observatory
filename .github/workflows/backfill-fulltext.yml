name: Catch up full-text research backlog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-fulltext.yml'
      - 'scripts/enrich_figure_links.py'
      - 'scripts/enrich.py'
      - 'scripts/enrich_pmc_oai.py'
      - 'scripts/enrich_pdf_fulltext.py'
      - 'scripts/enrich_repository_fulltext.py'
      - 'tests/test_repository_recovery.py'
      - 'scripts/fulltext_recovery_audit.py'
      - 'scripts/enrich_publisher_html.py'
      - 'tests/test_publisher_html.py'
      - 'tests/test_pmc_oai.py'
      - 'tests/test_pdf_fulltext.py'
      - 'tests/test_search_plan.py'
      - 'scripts/enrich_openalex_fulltext.py'
      - 'scripts/build_readings.py'
      - 'scripts/seed_historical.py'
  workflow_run:
    workflows: ["Update research library"]
    types: [completed]
    branches: [main]
  schedule:
    # Four modest checks per UTC day, with automatic API budget backoff.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observatory-index
  cancel-in-progress: false
jobs:
  catchup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_FULLTEXT_LIMIT: '36'
      PMC_OAI_LIMIT: '58'
      PMC_OAI_XML_LIMIT: '18'
      PDF_FULLTEXT_LOOKUPS: '22'
      PDF_FULLTEXT_DOWNLOADS: '9'
      PUBLISHER_HTML_LIMIT: '24'
      OPENALEX_CONTENT_LIMIT: '12'
      OA_ENRICH_LIMIT: '46'
      FIGURE_VERIFY_LIMIT: '5'
      REPO_OA_BATCH: '16'
      REPO_UNPAYWALL_LIMIT: '12'
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax before external requests
        run: python -m compileall -q scripts tests
      - name: Install PDF-text extractor
        run: python -m pip install "pypdf>=6.0,<7.0"
      - name: Try permitted Europe PMC full-text sources
        run: python scripts/enrich.py
      - name: Retrieve licensed PMC full text via DOI-to-PMC and official OAI-PMH
        run: python scripts/enrich_pmc_oai.py
      - name: Verify permissible journal figure images
        run: python scripts/enrich_figure_links.py
      - name: Resume licensed OpenAlex full-text queue
        run: python scripts/enrich_openalex_fulltext.py
      - name: Extract licensed OA PDF sections missing from XML providers
        run: python scripts/enrich_pdf_fulltext.py
      - name: Recover independent OA article PDFs via Semantic Scholar and Unpaywall
        run: python scripts/enrich_repository_fulltext.py
      - name: Read article sections on explicitly CC-BY publisher websites
        run: python scripts/enrich_publisher_html.py
      - name: Report actual full-text recovery and provider failures
        run: python scripts/fulltext_recovery_audit.py
      - name: Rebuild reading notes and public projection
        run: |
          python scripts/build_readings.py
          python scripts/build_public.py
          python scripts/build_issue.py
          python scripts/build_newsletter.py
          python scripts/pipeline_status.py
          python scripts/feed.py
      - name: Check that no citation-only records are published
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python -m json.tool data/fulltext-backfill-state.json >/dev/null
          python -m json.tool data/public-issue.json >/dev/null
          python -m json.tool data/public-library.json >/dev/null
          python -m json.tool data/public-weekly.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          readings=json.loads(Path("data/public-library.json").read_text())
          assert all(r["reading"]["level"]!="citation_only" for r in readings)
          assert all(r["reading"]["level"]!="curated" for r in readings if r["kind"]=="scholarly")
          print(f"Public index: {len(readings)} source-backed items, no citation-only records.")
          PY
      - name: Commit progress without restarting external calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml issue-feed.xml newsletter.html issues/
          if ! git diff --cached --quiet; then
            git commit -m "Backfill licensed article text and verified reading cards"
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Backfill conflict. Refusing to overwrite library changes."
                exit 1
              fi
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push backfill after three attempts."
              exit 1
            fi
          fi
