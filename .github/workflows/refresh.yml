name: Update research library
on:
  # New-source discovery happens weekly or when manually requested.
  # Source editing must not start a costly external search.
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Search mode
        type: choice
        default: backfill
        options: [backfill, weekly]
permissions:
  contents: write
concurrency:
  group: observatory-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OA_ENRICH_LIMIT: 55
      # Backfills make a deeper pass; normal weeks keep the API budget controlled.
      MODE: ${{ inputs.mode || 'weekly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MODE: ${{ inputs.mode || 'weekly' }}
        run: python scripts/update.py
      - name: Discover reporting, commentary and practitioner writing
        run: python scripts/discover_editorial.py
      - name: Seed selected public essays and design arguments
        run: python scripts/seed_editorial.py
      - name: Add official focus-product references
        run: python scripts/seed_products.py
      - name: Retrieve fuller abstracts across DOI registries
        run: python scripts/enrich_metadata.py
      - name: Locate legal open-access article versions
        run: python scripts/open_access_links.py
      - name: Build article-specific reading summaries
        run: python scripts/build_readings.py
      - name: Exclude citation-only metadata from public readings
        run: python scripts/build_public.py
      - name: Produce RSS
        run: python scripts/feed.py
      - name: Validate data and browser code
        run: |
          node --check app.js
          python -m compileall -q scripts tests
          python -m json.tool data/library.json > /dev/null
          python -m json.tool data/public-issue.json >/dev/null
          python -m json.tool data/public-library.json > /dev/null
          python -m json.tool data/weekly.json > /dev/null
          python -m unittest discover -s tests -v
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml issue-feed.xml newsletter.html issues/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh discovery, reading notes and RSS"
            # Source-code edits can advance main while the collector runs.
            # Rebase the completed result instead of making a second wave of
            # network requests (which previously exhausted the OpenAlex quota).
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              echo "Main advanced; rebasing existing data changes (attempt $attempt)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Data conflict during rebase; refusing to overwrite manually edited records."
                exit 1
              fi
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 3 rebase attempts."
              exit 1
            fi
          fi
