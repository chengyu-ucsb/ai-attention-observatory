name: Update research library
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update.py'
      - 'scripts/collection_window.py'
      - 'scripts/arxiv_publication.py'
      - 'scripts/priority_research.py'
      - 'scripts/discover_editorial.py'
      - 'data/editorial-sources.json'
      - 'scripts/brief_intake.py'
      - 'scripts/build_weekly.py'
      - 'data/brief-leads.json'
      - 'scripts/search_plan.py'
      - 'scripts/seed_historical.py'
      - '.github/workflows/refresh.yml'
  # Early closeout plus one late-index generation; later runs only resume cursors.
  # GitHub cron can be delayed. These are opportunities, not publication deadlines.
  schedule:
    - cron: '7 0,2,6,10 * * 1'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: Search mode
        type: choice
        default: weekly
        options: [backfill, weekly, rebuild]
      only_if_due:
        description: Recover a missing weekly launch only; do not replay an attempted week
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  # Every shared provider/checkpoint writer queues under this same lock.
  group: observatory-index
  queue: max
  cancel-in-progress: false
jobs:
  check_due:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Recheck a requested missed launch under the shared lock
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.only_if_due
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_MODE: ${{ inputs.mode }}
        run: |
          test "$RECOVERY_MODE" = weekly
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml" > /tmp/discovery-workflow.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/runs?per_page=100" > /tmp/discovery-runs.json
          python scripts/discovery_watchdog.py --workflow /tmp/discovery-workflow.json --runs /tmp/discovery-runs.json --current-run-id "$GITHUB_RUN_ID"
      - name: Skip redundant scheduled discovery
        id: check
        if: steps.recovery.outcome == 'skipped' || steps.recovery.outputs.dispatch == 'true'
        env:
          REFRESH_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from preparation_pipeline import closeout_plan
          plan = closeout_plan()
          needed = os.environ['REFRESH_EVENT'] != 'schedule' or plan['needed']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('needed=' + str(needed).lower() + '\n')
          print(json.dumps(plan))
          PY
  refresh:
    needs: check_due
    # Failed-jobs reruns may retain the old check_due outputs. A recovery
    # dispatch is first-attempt-only even when that preflight is not repeated.
    if: needs.check_due.outputs.needed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.only_if_due || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OA_ENRICH_LIMIT: 55
      # Normal source-code pushes rebuild only. An explicit [discover-weekly]
      # commit provides a cloud-only, auditable recovery path after missed schedules.
      MODE: ${{ inputs.mode || (github.event_name == 'push' && contains(github.event.head_commit.message, '[discover-weekly]') && 'weekly') || (github.event_name == 'push' && 'rebuild') || 'weekly' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Capture the actual closeout namespace
        id: closeout_scope
        if: env.MODE == 'weekly'
        run: python scripts/preparation_pipeline.py scope --phase closed
      - name: Collect historical metadata only in backfill mode
        if: env.MODE == 'backfill'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update.py
      - name: Reconcile and adopt the strict previous-week closeout
        if: env.MODE == 'weekly'
        run: python scripts/preparation_pipeline.py closeout --expected-week "${{ steps.closeout_scope.outputs.week }}" --max-requests 48 --max-feed-requests 24 --time-budget 240
      - name: Verify nominated weekly brief leads
        if: env.MODE == 'weekly'
        run: python scripts/brief_intake.py
      - name: Verify key earlier research by DOI only in separate backfill mode
        if: env.MODE == 'backfill'
        run: python scripts/seed_historical.py
      - name: Admit staged previous-week publisher metadata without another search
        if: env.MODE == 'weekly'
        run: python scripts/discover_editorial.py --cached-only
      - name: Seed selected public essays and design arguments
        run: python scripts/seed_editorial.py
      - name: Add official focus-product references
        run: python scripts/seed_products.py
      - name: Enrich historical metadata only in separate backfill mode
        if: env.MODE == 'backfill'
        run: python scripts/enrich_metadata.py
      - name: Locate historical OA links only in separate backfill mode
        if: env.MODE == 'backfill'
        run: python scripts/open_access_links.py
      - name: Build article-specific reading summaries
        run: python scripts/build_readings.py
      - name: Freeze complete weekly source membership
        if: env.MODE != 'backfill'
        run: python scripts/build_weekly.py
      - name: Exclude citation-only metadata from public readings
        run: python scripts/build_public.py
      - name: Rebuild approved editorial and newsletter feed
        run: |
          python scripts/build_issue.py
          python scripts/build_newsletter.py
          python scripts/pipeline_status.py
      - name: Produce research RSS
        run: python scripts/feed.py
      - name: Validate data and browser code
        run: |
          node --check app.js
          python -m compileall -q scripts tests
          python -m json.tool data/library.json > /dev/null
          python -m json.tool data/public-issue.json >/dev/null
          python -m json.tool data/public-library.json > /dev/null
          python -m json.tool data/weekly.json > /dev/null
          python -m unittest discover -s tests -v
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml issue-feed.xml newsletter.html issues/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh discovery, reading notes and RSS"
            # Source-code edits can advance main while the collector runs.
            # Rebase the completed result instead of making a second wave of
            # network requests (which previously exhausted the OpenAlex quota).
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              echo "Main advanced; rebasing existing data changes (attempt $attempt)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Data conflict during rebase; refusing to overwrite manually edited records."
                exit 1
              fi
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 3 rebase attempts."
              exit 1
            fi
          fi
      - name: Protect valid closeout checkpoints after interrupted downstream work
        id: closeout_checkpoint
        if: failure() && env.MODE == 'weekly' && steps.closeout_scope.outputs.week != ''
        run: python scripts/preparation_pipeline.py checkpoint --phase closed --week "${{ steps.closeout_scope.outputs.week }}" --destination "$RUNNER_TEMP/validated-closeout"
      - name: Save validated closeout work without replaying collection
        if: always() && steps.closeout_checkpoint.outputs.valid == 'true'
        run: |
          save_tree="$RUNNER_TEMP/closeout-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/preparation_pipeline.py checkpoint-commit --destination "$RUNNER_TEMP/validated-closeout" --worktree "$save_tree"
          cd "$save_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Closeout checkpoint conflict; keep the validated recovery artifact.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Retain only validated closeout metadata
        if: always() && steps.closeout_checkpoint.outputs.valid == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: refresh-closeout-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-closeout/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve other-mode results if saving or validation fails
        if: failure() && env.MODE != 'weekly'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: research-recovery-${{ github.run_id }}
          path: |
            data/
            feed.xml
            issue-feed.xml
            newsletter.html
            issues/
          retention-days: 7
          if-no-files-found: warn

