name: Update research library
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Search mode
        type: choice
        default: backfill
        options: [backfill, weekly]
permissions:
  contents: write
concurrency:
  group: observatory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OA_ENRICH_LIMIT: 55
      # Backfills make a deeper pass; normal weeks keep the API budget controlled.
      OPENALEX_FULLTEXT_LIMIT: ${{ inputs.mode == 'backfill' && '100' || '45' }}
      MODE: ${{ inputs.mode || 'weekly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MODE: ${{ inputs.mode || 'weekly' }}
        run: python scripts/update.py
      - name: Discover reporting, commentary and practitioner writing
        run: python scripts/discover_editorial.py
      - name: Seed selected public essays and design arguments
        run: python scripts/seed_editorial.py
      - name: Add official focus-product references
        run: python scripts/seed_products.py
      - name: Retrieve fuller abstracts across DOI registries
        run: python scripts/enrich_metadata.py
      - name: Locate legal open-access article versions
        run: python scripts/open_access_links.py
      - name: Extract permitted open-access article sections
        run: python scripts/enrich.py
      - name: Read licensed OpenAlex full texts when credentials are available
        run: python scripts/enrich_openalex_fulltext.py
      - name: Build article-specific reading summaries
        run: python scripts/build_readings.py
      - name: Produce RSS
        run: python scripts/feed.py
      - name: Validate data and browser code
        run: |
          node --check app.js
          python -m json.tool data/library.json > /dev/null
          python -m json.tool data/weekly.json > /dev/null
          python -m unittest discover -s tests -v
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh discovery, reading notes and RSS"
            if ! git push; then
              echo "Branch advanced during refresh. Re-running on latest main."
              git fetch origin main
              git reset --hard origin/main
              python scripts/update.py
              python scripts/discover_editorial.py
              python scripts/seed_editorial.py
              python scripts/seed_products.py
              python scripts/enrich_metadata.py
              python scripts/open_access_links.py
              python scripts/enrich.py
              python scripts/enrich_openalex_fulltext.py
              python scripts/build_readings.py
              python scripts/feed.py
              python -m unittest discover -s tests -v
              git add data/ feed.xml
              if ! git diff --cached --quiet; then
                git commit -m "Refresh discovery after branch update"
                git push
              fi
            fi
          fi
