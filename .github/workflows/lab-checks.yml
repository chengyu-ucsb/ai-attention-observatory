name: Check Experimental Lab
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'lab-play.*'
      - 'tests/validate_playground*'
      - '.github/workflows/lab-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'lab-play.*'
      - 'tests/validate_playground*'
      - '.github/workflows/lab-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    name: Lab (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Official releases and node24 runtimes verified 2026-11-06.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Lab behavior without a browser
        run: |
          node --check lab-play.js
          node tests/validate_playground.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.64.1'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check desktop and mobile ${{ matrix.browser }} flows
        run: python tests/validate_playground_browser.py --browser ${{ matrix.browser }} --screenshots /tmp/lab-screenshots
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: experimental-lab-${{ matrix.browser }}-screenshots
          path: /tmp/lab-screenshots
          retention-days: 7
          if-no-files-found: ignore

