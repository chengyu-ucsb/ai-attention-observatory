name: Publish observatory website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'lab-play.js'
      - 'lab-play.css'
      - 'styles.css'
      - 'favicon.svg'
      - 'data/**'
      - 'feed.xml'
      - 'scripts/build_public.py'
      - 'scripts/build_issue.py'
      - 'scripts/build_newsletter.py'
      - 'scripts/condense_readings.py'
      - 'data/issue-editorial.json'
      - 'tests/validate_weekly_issue.cjs'
      - 'tests/test_condense_readings.py'
      - 'scripts/feed.py'
      - 'tests/validate_playground.cjs'
      - 'tests/validate_article_ui.cjs'
      - '.github/workflows/publish.yml'
  workflow_run:
    workflows: ["Update research library"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Build safe public reading library and RSS
        run: |
          python scripts/build_public.py
          python scripts/build_issue.py
          python scripts/build_newsletter.py
          python scripts/feed.py
      - name: Validate published application
        run: |
          node --check app.js
          node --check lab-play.js
          node tests/validate_playground.cjs
          node tests/validate_article_ui.cjs
          node tests/validate_weekly_issue.cjs
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          test -s lab-play.css
          test -s index.html
          test -s styles.css
          test -s favicon.svg
          test -s data/public-library.json
          test -s data/public-weekly.json
          python - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path("data/public-library.json").read_text())
          assert all(r.get("reading",{}).get("level")!="citation_only" for r in records)
          print(f"Publishing {len(records)} readings; zero citation-only records.")
          PY
          test -s feed.xml
          test -s issue-feed.xml
          test -s newsletter.html
          test -s data/public-issue.json
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html app.js styles.css lab-play.js lab-play.css favicon.svg feed.xml issue-feed.xml newsletter.html _site/
          mkdir -p _site/data
          cp data/public-library.json data/public-weekly.json data/public-issue.json _site/data/
          if [ -s data/runs.json ]; then cp data/runs.json _site/data/; fi
          if [ -s data/fulltext-backfill-state.json ]; then cp data/fulltext-backfill-state.json _site/data/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
