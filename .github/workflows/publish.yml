name: Publish observatory website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data/**'
      - 'feed.xml'
      - '.github/workflows/publish.yml'
  workflow_run:
    workflows: ["Update research library"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate published application
        run: |
          node --check app.js
          test -s index.html
          test -s styles.css
          test -s data/library.json
          test -s data/weekly.json
          test -s feed.xml
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html app.js styles.css feed.xml _site/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
