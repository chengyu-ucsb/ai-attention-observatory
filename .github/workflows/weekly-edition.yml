name: Publish weekly edition
on:
  workflow_run:
    workflows: ["Finalize weekly source readings"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/compose_issue.py'
      - 'scripts/replay_weekly_edition.py'
      - 'scripts/download_issue_model.py'
      - 'scripts/edition_references.py'
      - 'scripts/edition_progress.py'
      - 'scripts/edition_schedule.py'
      - 'data/original-readings.json'
      - '.github/workflows/weekly-edition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/compose_issue.py'
      - 'scripts/replay_weekly_edition.py'
      - 'scripts/download_issue_model.py'
      - 'scripts/edition_references.py'
      - 'scripts/edition_progress.py'
      - 'scripts/edition_schedule.py'
      - 'data/original-readings.json'
      - 'tests/test_compose_issue.py'
      - 'tests/test_replay_weekly_edition.py'
      - 'tests/test_download_issue_model.py'
      - 'tests/test_edition_references.py'
      - '.github/workflows/weekly-edition.yml'
  # Recovery if an upstream run fails before dispatching its successor.
  schedule:
    # Last pre-deadline start leaves 60m for composition, 20m for deployment,
    # and over an hour for queue delays or recovery before noon.
    - cron: '17 4,7,9,16 * * 1'
      timezone: America/New_York
    - cron: '17 12 * * 0,2-6'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('observatory-check-{0}-{1}', github.workflow, github.ref) || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.head_repository.full_name != github.repository || github.event.workflow_run.head_branch != 'main')) && format('observatory-skip-{0}', github.run_id) || 'observatory-edition' }}
  queue: max
  cancel-in-progress: false
jobs:
  edition:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      OBSERVATORY_STORE_URL: https://jrndagmzayiwpmyjtczx.supabase.co/functions/v1/observatory-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Validate offline
        run: python -m unittest discover -s tests -v
      - name: Require final reading of the current late-index packet
        id: final_reading
        if: github.event_name != 'pull_request'
        run: python scripts/preparation_pipeline.py edition-check --reconcile-legacy-library
      - name: Check whether this week already has an edition
        id: edition
        if: github.event_name != 'pull_request' && steps.final_reading.outputs.ready == 'true'
        run: |
          # Reconcile newly accepted/revoked readings before using a cached shelf.
          # This is local projection only, never discovery or source retrieval.
          python scripts/build_public.py
          python scripts/compose_issue.py --check
      - name: Install runner-local inference
        if: steps.edition.outputs.needs_model == 'true'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            'llama-cpp-python==0.3.36'
      - name: Download official open model weights
        if: steps.edition.outputs.needs_model == 'true'
        run: python scripts/download_issue_model.py /tmp
      - name: Compose and validate the canonical website edition
        if: steps.edition.outputs.needed == 'true'
        env:
          LOCAL_ISSUE_MODEL: /tmp/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
        run: |
          python scripts/compose_issue.py
          python scripts/compose_issue.py --verify-release
          python scripts/build_issue.py
          python scripts/build_newsletter.py
          python scripts/pipeline_status.py
          node tests/validate_weekly_issue.cjs
          python -m unittest discover -s tests -v
      - name: Save the edition and RSS together
        if: steps.edition.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ issue-feed.xml newsletter.html issues/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish source-grounded weekly edition and RSS"
          if git push origin HEAD:main; then exit 0; fi

          # Keep the original checkout intact for the recovery artifact. Rebuild
          # on current main from the checked draft without repeating inference.
          policy=$(PYTHONPATH=scripts python -c 'from edition_progress import policy_signature; print(policy_signature())')
          for attempt in 1 2 3; do
            git fetch origin main
            checkout="$RUNNER_TEMP/weekly-release-$attempt"
            git worktree add --detach "$checkout" origin/main
            (
              cd "$checkout"
              python scripts/replay_weekly_edition.py "$GITHUB_WORKSPACE" "$policy"
              git add data/ issue-feed.xml newsletter.html issues/
              if ! git diff --cached --quiet; then
                git commit -m "Publish checked weekly edition on current sources"
              fi
            )
            if git -C "$checkout" push origin HEAD:main; then exit 0; fi
            git worktree remove "$checkout"
          done
          echo "::error::Concurrent updates prevented publication after three verified retries."
          exit 1
      - name: Preserve draft and evidence if publication fails
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: weekly-edition-recovery-${{ github.run_id }}
          # Private stage checkpoints already survive every successful save.
          # Keep the actual draft and its evidence packet, not another 95 MB
          # copy of the source database on every failure. Main retains inputs.
          path: |
            data/edition-audits/
            data/issue-editorial.json
            data/public-issue.json
            data/public-featured-issue.json
            data/issue-feed.json
            data/approved-issues/
            issue-feed.xml
            newsletter.html
            issues/
          retention-days: 7
          if-no-files-found: warn

