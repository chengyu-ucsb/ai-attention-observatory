name: Prepare rolling weekly readings
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/prepare-weekly-readings.yml'
  # Build the open week's source and reading coverage before Sunday closes.
  schedule:
    - cron: '17 6,18 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preparation, closeout, feeds and acquisition share provider controls.
  group: ${{ github.event_name == 'pull_request' && format('preparation-check-{0}-{1}', github.workflow, github.ref) || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.head_repository.full_name != github.repository || github.event.workflow_run.head_branch != 'main')) && format('preparation-skip-{0}', github.run_id) || 'observatory-index' }}
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Official Node 24 releases verified November 9, 2026.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pypdf>=6.0,<7.0'
      - name: Check offline gates only
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check app.js
          node tests/validate_weekly_window.cjs
  process:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    # 8m acquisition + 2 x 20m review, bounded revalidation, setup and validation.
    # This cap is not a measured full-corpus review throughput estimate.
    timeout-minutes: 80
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OBSERVATORY_STORE_URL: https://jrndagmzayiwpmyjtczx.supabase.co/functions/v1/observatory-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Capture the actual target namespace before doing work
        id: scope
        run: python scripts/preparation_pipeline.py scope --phase preparing
      - name: Capture bounded current-week metadata without publishing
        run: python scripts/preparation_pipeline.py prepare --expected-week "${{ steps.scope.outputs.week }}" --max-requests 48 --max-feed-requests 24 --time-budget 240
      - name: Check actual UTC packet and calendar phase
        id: plan
        run: python scripts/preparation_pipeline.py reading-plan --phase preparing
      - name: Lease this reading pass in the private database
        id: worker
        if: steps.plan.outputs.ready == 'true'
        run: python scripts/worker_run.py begin --phase preparing --lease "$RUNNER_TEMP/observatory-worker.json"
      - name: Install bounded local inference and PDF parser
        if: steps.worker.outputs.claimed == 'true'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            'llama-cpp-python>=0.3.0,<0.4' 'pypdf>=6.0,<7.0'
          python -m pip install --disable-pip-version-check -r requirements-database.txt
      - name: Download the existing official open reading model
        if: steps.worker.outputs.claimed == 'true'
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 420 \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf' \
            --output /tmp/attention-model.gguf
          test "$(stat -c '%s' /tmp/attention-model.gguf)" -gt 900000000
      - name: Run real bounded acquisition and machine reading stages
        id: readings
        if: steps.worker.outputs.claimed == 'true'
        env:
          LOCAL_READING_MODEL: /tmp/attention-model.gguf
          OBSERVATORY_STORE_URL: https://jrndagmzayiwpmyjtczx.supabase.co/functions/v1/observatory-store
          OBSERVATORY_DATABASE_URL: ${{ secrets.OBSERVATORY_DATABASE_URL }}
        run: python scripts/preparation_pipeline.py readings --phase preparing --expected-week "${{ steps.scope.outputs.week }}"
      - name: Validate final local outputs
        id: validation
        if: steps.readings.outcome == 'success'
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check app.js
          node tests/validate_weekly_window.cjs
      - name: Protect validated metadata even if later stages failed
        id: checkpoint
        if: always() && steps.scope.outputs.week != ''
        run: |
          python scripts/preparation_pipeline.py checkpoint --phase preparing --week "${{ steps.scope.outputs.week }}" --destination "$RUNNER_TEMP/validated-preparation"
      - name: Save checkpoints without repeating external work on a push race
        id: saved
        if: always() && steps.checkpoint.outputs.valid == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          save_tree="$RUNNER_TEMP/preparation-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/preparation_pipeline.py checkpoint-commit --destination "$RUNNER_TEMP/validated-preparation" --worktree "$save_tree"
          cd "$save_tree"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Checkpoint conflict; preserved validated artifacts require reconciliation.'
              exit 1
            fi
            if git push origin HEAD:main; then
              printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Retain only validated staging and provider metadata
        if: always() && steps.checkpoint.outputs.valid == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rolling-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-preparation/
          retention-days: 7
          if-no-files-found: error
      - name: Record the actual reading outcome in the database
        if: always() && steps.worker.outputs.claimed == 'true'
        env:
          WORKER_SAVED: ${{ steps.readings.outcome == 'success' && steps.validation.outcome == 'success' && steps.saved.outcome == 'success' }}
          WORKER_COMMIT: ${{ steps.saved.outputs.commit }}
        run: python scripts/worker_run.py finish --lease "$RUNNER_TEMP/observatory-worker.json"
