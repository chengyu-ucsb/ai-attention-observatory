name: Deepen source readings
on:
  # Code changes receive offline PR checks, not extra production model runs.
  # Keep the regular production schedule and manual runs available below.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/enrich_deep_readings.py'
      - 'scripts/full_document_access.py'
      - 'scripts/crossref_locations.py'
      - 'scripts/structured_article_access.py'
      - 'scripts/openaire_locations.py'
      - 'scripts/comprehensive_readings.py'
      - 'scripts/acquisition_handoff.py'
      - 'scripts/collect_weekly_sources.py'
      - 'scripts/source_receipt_refresh.py'
      - 'scripts/source_access_controls.py'
      - 'scripts/reading_checkpoint.py'
      - 'scripts/prepared_reading_schema.py'
      - 'scripts/condense_readings.py'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/deepen-readings.yml'
  schedule:
    - cron: '35 13 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('observatory-check-{0}-{1}', github.workflow, github.ref) || 'observatory-index' }}
  queue: max
  cancel-in-progress: false
jobs:
  deepen:
    runs-on: ubuntu-24.04
    # Reserve checkpoint/recovery time after the bounded 50-minute reading step.
    timeout-minutes: 95
    steps:
      # Official Node 24 releases and ubuntu-24.04 compatibility checked Nov 9, 2026.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Validate pipeline and page rendering without network
        timeout-minutes: 5
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check app.js
          node tests/validate_article_ui.cjs
      - name: Install PDF extraction and local CPU inference
        timeout-minutes: 8
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            'llama-cpp-python>=0.3.0,<0.4' 'pypdf>=6.0,<7.0'
      - name: Download open model weights without hosted inference
        timeout-minutes: 8
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 420 \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf' \
            --output /tmp/attention-model.gguf
          test "$(stat -c '%s' /tmp/attention-model.gguf)" -gt 900000000
      - name: Read complete retrieved text and check each claim
        id: readings
        timeout-minutes: 50
        if: github.event_name != 'pull_request'
        env:
          LOCAL_READING_MODEL: /tmp/attention-model.gguf
          DEEP_READING_LIMIT: '2'
          # Reuse the provider secret already used by research backfill.
          # Only trusted scheduled/manual runs reach this step; never PRs.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/comprehensive_readings.py
      - name: Validate completed notes before saving
        id: validation
        timeout-minutes: 5
        if: github.event_name != 'pull_request'
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool data/library.json >/dev/null
      - name: Preserve independently validated acquisition metadata after reading
        id: checkpoint
        timeout-minutes: 2
        if: always() && github.event_name != 'pull_request' && (steps.readings.outcome == 'success' || steps.readings.outcome == 'failure' || steps.readings.outcome == 'cancelled')
        env:
          INCLUDE_LIBRARY: ${{ steps.readings.outcome == 'success' && steps.validation.outcome == 'success' }}
        run: |
          args=()
          if [ "$INCLUDE_LIBRARY" = true ]; then args+=(--include-library); fi
          python scripts/reading_checkpoint.py snapshot --destination "$RUNNER_TEMP/validated-readings" "${args[@]}"
      - name: Save exact validated checkpoint without replaying source or model work
        timeout-minutes: 4
        if: always() && github.event_name != 'pull_request' && steps.checkpoint.outputs.valid == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          save_tree="$RUNNER_TEMP/reading-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/reading_checkpoint.py commit --destination "$RUNNER_TEMP/validated-readings" --worktree "$save_tree"
          # No local change means there is no saved result to rebase or push.
          if [ "$(git -C "$save_tree" rev-parse HEAD)" = "$(git rev-parse HEAD)" ]; then exit 0; fi
          cd "$save_tree"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Checkpoint conflict; preserved validated artifact requires reconciliation.'
              exit 1
            fi
            python "$GITHUB_WORKSPACE/scripts/reading_checkpoint.py" verify --root "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/validated-readings" --worktree "$save_tree"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo '::error::Could not save validated reading checkpoint.'
          exit 1
      - name: Retain validated recovery metadata and permitted original notes
        timeout-minutes: 2
        if: always() && github.event_name != 'pull_request' && steps.checkpoint.outputs.valid == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reading-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-readings/
          retention-days: 7
          if-no-files-found: error
