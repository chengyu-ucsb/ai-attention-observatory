name: Deepen source readings
on:
  # Separate editorial reading from weekly discovery and full-text retrieval.
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_deep_readings.py'
      - 'tests/test_deep_readings.py'
      - '.github/workflows/deepen-readings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/enrich_deep_readings.py'
      - 'scripts/condense_readings.py'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/deepen-readings.yml'
  schedule:
    - cron: '35 13 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observatory-index
  cancel-in-progress: false
jobs:
  deepen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate pipeline and page rendering without network
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check app.js
          node tests/validate_article_ui.cjs
      - name: Install local CPU inference (no paid API)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            'llama-cpp-python>=0.3.0,<0.4'
      - name: Download open model weights (no hosted inference)
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' \
            --output /tmp/attention-model.gguf
          test "$(stat -c '%s' /tmp/attention-model.gguf)" -gt 200000000
      - name: Analyze up to four accessible sources, entirely on runner
        if: github.event_name != 'pull_request'
        env:
          LOCAL_READING_MODEL: /tmp/attention-model.gguf
          DEEP_READING_LIMIT: '4'
        run: python scripts/enrich_deep_readings.py
      - name: Save newly read sources without rerunning discovery
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library.json
          if ! git diff --cached --quiet; then
            git commit -m "Add local source-grounded readings"
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Data conflicts require reconciliation; no external search was rerun."
                exit 1
              fi
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not save completed readings."
              exit 1
            fi
          fi
